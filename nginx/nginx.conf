events {}

http {

    server {
        listen 80;

        # Eureka Dashboard
        location /eureka/ {
            proxy_pass http://service-registry:8761/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_redirect / /eureka/;

            sub_filter_types text/html;
            sub_filter_once off;
            sub_filter 'href="/' 'href="/eureka/';
            sub_filter 'src="/'  'src="/eureka/';
        }

        # Department Service
        location /department/ {
            proxy_pass http://department-service:9001/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # User Service
        location /user/ {
            proxy_pass http://user-service:9002/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}