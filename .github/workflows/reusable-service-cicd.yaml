name: Reusable Microservice CI/CD

on:
  workflow_call:
    inputs:
      service_name:
        description: "Microservice name"
        required: true
        type: string

      deploy_env:
        description: "Deployment environment"
        required: true
        type: string

      mysql_database:
        description: "Test database name"
        required: true
        type: string

      image_tag:
        description: "Docker image tag"
        required: false
        default: ""
        type: string

    secrets:
      ORACLE_HOST:
        required: true

      ORACLE_USERNAME:
        required: true

      ORACLE_SSH_KEY:
        required: true

permissions:
  contents: read
  packages: write

jobs:

  build-and-test:

    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0

        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ${{ inputs.mysql_database }}

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Verify MySQL
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -proot -e "SELECT 1;"
          mysql -h 127.0.0.1 -P 3306 -uroot -proot -e "SHOW DATABASES;"

      - name: Run tests
        run: ./mvnw clean test

      - name: Build application
        run: ./mvnw package -DskipTests

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/${{ inputs.service_name }}

          docker build \
            -t $IMAGE_NAME:${{ github.sha }} .

          docker push \
            $IMAGE_NAME:${{ github.sha }}

  deploy:

    needs: build-and-test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest

    environment:
      name: ${{ inputs.deploy_env }}

    steps:

      - name: Deploy to Oracle VM
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USERNAME }}
          key: ${{ secrets.ORACLE_SSH_KEY }}

          script: |
            cd /home/ubuntu/deployment-config

            export SERVICE_NAME="${{ inputs.service_name }}"
            export IMAGE_TAG="${{ inputs.image_tag || github.sha }}"

            echo "===================================="
            echo "Deploying: $SERVICE_NAME"
            echo "Environment: ${{ inputs.deploy_env }}"
            echo "Image tag: $IMAGE_TAG"
            echo "===================================="

            case "$SERVICE_NAME" in

              auth-service)
                export AUTH_SERVICE_TAG="$IMAGE_TAG"
                ;;

              user-service)
                export USER_SERVICE_TAG="$IMAGE_TAG"
                ;;
                
              service-registry)
                export SERVICE_REGISTRY_TAG="$IMAGE_TAG"
                ;;

              department-service)
                export DEPARTMENT_SERVICE_TAG="$IMAGE_TAG"
                ;;
                
              department-service)
                export DEPARTMENT_SERVICE_TAG="$IMAGE_TAG"
                ;;

              api-gateway)
                export API_GATEWAY_TAG="$IMAGE_TAG"
                ;;

              *)
                echo "Unknown service: $SERVICE_NAME"
                exit 1
                ;;

            esac

            set -e
            
            docker compose pull "$SERVICE_NAME"

            docker compose up -d --no-build --no-deps "$SERVICE_NAME"

            echo "Deployment completed successfully."