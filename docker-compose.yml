version: "3.9"

services:

  nginx:
    image: nginx:1.28-alpine
    container_name: nginx

    ports:
      - "80:80"
      - "443:443"

    restart: unless-stopped

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt

    depends_on:
      service-registry:
        condition: service_healthy
      department-service:
        condition: service_started
      user-service:
        condition: service_started

    networks:
      - microservice-network

  service-registry:
    build:
      context: ../service-registry
    image: ambuj/service-registry:v1
    container_name: service-registry
    restart: unless-stopped
    ports:
      - "8761:8761"
    networks:
      - microservice-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  department-service:
    build:
      context: ../department-service
    image: ambuj/department-service:v1
    container_name: department-service
    restart: unless-stopped
    ports:
      - "9001:9001"
    depends_on:
      service-registry:
        condition: service_healthy
    networks:
      - microservice-network

  user-service:
    build:
      context: ../user-service
    image: ambuj/user-service:v1
    container_name: user-service
    restart: unless-stopped
    ports:
      - "9002:9002"
    depends_on:
      service-registry:
        condition: service_healthy
      department-service:
        condition: service_started
    networks:
      - microservice-network
 
  api-gateway:
    build:
      context: ../api-gateway
    image: ambuj/api-gateway:v1
    container_name: api-gateway
    restart: unless-stopped

    ports:
      - "9196:9196"

    depends_on:
      service-registry:
        condition: service_healthy
      auth-service:
        condition: service_started

    networks:
      - microservice-network
     
  auth-service:
    build:
      context: ../auth-service
    image: ambuj/auth-service:v1
    container_name: auth-service
    restart: unless-stopped

    ports:
      - "9197:9197"

    depends_on:
      service-registry:
        condition: service_healthy

    networks:
      - microservice-network
      
  email-service:
    build:
      context: ../email-service
    image: ambuj/email-service:v1
    container_name: email-service
    restart: unless-stopped

    ports:
       - "9003:9003"
       
    environment:
     BREVO_USERNAME: ${BREVO_USERNAME}
     BREVO_PASSWORD: ${BREVO_PASSWORD}


    depends_on:
      - kafka

    networks:
      - microservice-network

  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka
    restart: unless-stopped

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

    networks:
      - microservice-network
  
networks:
  microservice-network:
    driver: bridge