version: "3.9"

services:

  nginx:
    image: nginx:1.28-alpine
    container_name: nginx

    ports:
      - "80:80"
      - "443:443"

    restart: unless-stopped

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt

    depends_on:
      service-registry:
        condition: service_healthy
      department-service:
        condition: service_started
      user-service:
        condition: service_started

    networks:
      - microservice-network

  service-registry:
    build:
      context: ../service-registry
    image: ambuj/service-registry:v1
    container_name: service-registry
    restart: unless-stopped
    ports:
      - "8761:8761"
    networks:
      - microservice-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  department-service:
    build:
      context: ../department-service
    image: ambuj/department-service:v1
    container_name: department-service
    restart: unless-stopped
    ports:
      - "9001:9001"
    depends_on:
      service-registry:
        condition: service_healthy
    networks:
      - microservice-network

  user-service:
    build:
      context: ../user-service
    image: ambuj/user-service:v1
    container_name: user-service
    restart: unless-stopped
    ports:
      - "9002:9002"
    depends_on:
      service-registry:
        condition: service_healthy
      department-service:
        condition: service_started
    networks:
      - microservice-network
 
  api-gateway:
    build:
      context: ../api-gateway
    image: ambuj/api-gateway:v1
    container_name: api-gateway
    restart: unless-stopped

    ports:
      - "9196:9196"

    depends_on:
      service-registry:
        condition: service_healthy
      auth-service:
        condition: service_started

    networks:
      - microservice-network
     
   auth-service:
    build:
      context: ../auth-service
    image: ambuj/auth-service:v1
    container_name: auth-service
    restart: unless-stopped

    ports:
      - "9197:9197"

    depends_on:
      service-registry:
        condition: service_healthy

    networks:
      - microservice-network

networks:
  microservice-network:
    driver: bridge